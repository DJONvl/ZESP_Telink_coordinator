name: build sampleGW_b91

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: "telink_zigbee_sdk commit to build against"
        default: "09fa2c3483b3aa2f0a6f2e2cc7e267cd6f1f9277"
        required: false
      release:
        description: "Create GitHub Release with .ybl after build"
        type: boolean
        default: false

permissions:
  contents: write

env:
  SDK_REF: ${{ inputs.sdk_ref || '09fa2c3483b3aa2f0a6f2e2cc7e267cd6f1f9277' }}
  SDK_URL: https://github.com/telink-semi/telink_zigbee_sdk
  TOOLCHAIN_URL: https://github.com/andestech/Andes-Development-Kit/releases/download/ast-v3_2_3-release-linux/nds32le-elf-mculib-v5f.txz
  TOOLCHAIN_DIR: /opt/nds32le-elf-mculib-v5f

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout overlay repo
        uses: actions/checkout@v4

      - name: Setup Python (packer needs stdlib only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Clone upstream SDK at pinned ref
        run: |
          git clone "$SDK_URL" sdk
          cd sdk
          git checkout "$SDK_REF"

      - name: Apply overlay
        run: |
          python scripts/apply-overlay.py overlay/tl_zigbee_sdk sdk/tl_zigbee_sdk

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: /opt/nds32le-elf-mculib-v5f
          key: nds32le-v5f-gcc74-ast-v3_2_3

      - name: Fetch Linux toolchain (Andes V3.2.3 / GCC 7.4, same as Telink RDS V3.2.3)
        run: |
          if [ -x "$TOOLCHAIN_DIR/bin/riscv32-elf-gcc" ]; then
            echo "toolchain cached"
          else
            wget -q "$TOOLCHAIN_URL" -O /tmp/nds32le-elf-mculib-v5f.txz
            sudo mkdir -p /opt
            sudo tar -xf /tmp/nds32le-elf-mculib-v5f.txz -C /opt
            rm /tmp/nds32le-elf-mculib-v5f.txz
          fi
          "$TOOLCHAIN_DIR/bin/riscv32-elf-gcc" --version

      - name: Configure (CMake, Unix Makefiles)
        run: |
          cmake -G "Unix Makefiles" \
            -DTOOLCHAIN_PATH="$TOOLCHAIN_DIR" \
            -S sdk/tl_zigbee_sdk \
            -B sdk/tl_zigbee_sdk/cmake_build

      - name: Build sampleGW_b91
        run: |
          cmake --build sdk/tl_zigbee_sdk/cmake_build --target sampleGW_b91 -j$(nproc)

      - name: Pack .ybl
        run: |
          python tools/mk_yandex2.py sdk/tl_zigbee_sdk/cmake_build/sampleGW_b91.bin sdk/tl_zigbee_sdk/cmake_build/sampleGW_b91_yandex2.ybl
          ls -lh sdk/tl_zigbee_sdk/cmake_build/sampleGW_b91.bin sdk/tl_zigbee_sdk/cmake_build/sampleGW_b91_yandex2.ybl
          cat sdk/tl_zigbee_sdk/cmake_build/sampleGW_b91.map | head -20 || true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sampleGW_b91-fw
          path: |
            sdk/tl_zigbee_sdk/cmake_build/sampleGW_b91.bin
            sdk/tl_zigbee_sdk/cmake_build/sampleGW_b91_yandex2.ybl
            sdk/tl_zigbee_sdk/cmake_build/sampleGW_b91.map

      - name: Publish Release (tag v* or manual release=true)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sdk/tl_zigbee_sdk/cmake_build/sampleGW_b91_yandex2.ybl
            sdk/tl_zigbee_sdk/cmake_build/sampleGW_b91.bin
            sdk/tl_zigbee_sdk/cmake_build/sampleGW_b91.map
          generate_release_notes: true
          fail_on_unmatched_files: true
