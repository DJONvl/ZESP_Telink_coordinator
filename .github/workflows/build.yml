name: build sampleGW_b91

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: "telink_zigbee_sdk commit to build against"
        default: "09fa2c3483b3aa2f0a6f2e2cc7e267cd6f1f9277"
        required: false

env:
  # Pinned upstream commit (master tip at the time the local tree was cloned).
  # If apply-overlay fails with "expected stock file missing", update this to a
  # newer commit and re-run. See sdk-ref.txt.
  SDK_REF: ${{ inputs.sdk_ref || '09fa2c3483b3aa2f0a6f2e2cc7e267cd6f1f9277' }}
  SDK_URL: https://github.com/telink-semi/telink_zigbee_sdk
  # Toolchain bundle uploaded once as a Release asset in THIS repo
  # (see README: how to zip it from a Telink IoT Studio install).
  TOOLCHAIN_ASSET: toolchain-nds32le-v5f-gcc74-win.zip
  TOOLCHAIN_TAG: toolchain
  TOOLCHAIN_DIR: C:\telink-toolchain

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout overlay repo
        uses: actions/checkout@v4

      - name: Setup Python (packer needs stdlib only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Clone upstream SDK at pinned ref
        shell: powershell
        run: |
          git clone $env:SDK_URL sdk
          cd sdk
          git checkout $env:SDK_REF

      - name: Apply overlay
        shell: powershell
        run: |
          python scripts/apply-overlay.py overlay/tl_zigbee_sdk sdk/tl_zigbee_sdk

      - name: Fetch toolchain bundle from Release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:TOOLCHAIN_DIR | Out-Null
          gh release download $env:TOOLCHAIN_TAG --pattern $env:TOOLCHAIN_ASSET --dir $env:TOOLCHAIN_DIR --clobber
          Expand-Archive -LiteralPath (Join-Path $env:TOOLCHAIN_DIR $env:TOOLCHAIN_ASSET) -DestinationPath $env:TOOLCHAIN_DIR -Force
          Get-ChildItem $env:TOOLCHAIN_DIR -Recurse -Depth 2 | Select-Object FullName
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install MinGW make
        shell: powershell
        run: |
          choco install mingw -y --no-progress
          mingw32-make --version

      - name: Configure (CMake, MinGW Makefiles)
        shell: powershell
        run: |
          $tc = Join-Path $env:TOOLCHAIN_DIR "nds32le-elf-mculib-v5f"
          cmake -G "MinGW Makefiles" `
            -DTOOLCHAIN_PATH="$tc" `
            -DCMAKE_MAKE_PROGRAM="C:/ProgramData/chocolatey/bin/mingw32-make.exe" `
            -S sdk/tl_zigbee_sdk `
            -B sdk/tl_zigbee_sdk/cmake_build

      - name: Build sampleGW_b91
        shell: powershell
        run: |
          $tcBin = Join-Path $env:TOOLCHAIN_DIR "nds32le-elf-mculib-v5f/bin"
          $cygBin = Join-Path $env:TOOLCHAIN_DIR "cygwin/bin"
          $env:Path = "$cygBin;$tcBin;" + $env:Path
          cmake --build sdk/tl_zigbee_sdk/cmake_build --target sampleGW_b91 -j8

      - name: Pack .ybl
        shell: powershell
        run: |
          python tools/mk_yandex2.py sdk/tl_zigbee_sdk/cmake_build/sampleGW_b91.bin sdk/tl_zigbee_sdk/cmake_build/sampleGW_b91_yandex2.ybl
          Get-Item sdk/tl_zigbee_sdk/cmake_build/sampleGW_b91.bin, sdk/tl_zigbee_sdk/cmake_build/sampleGW_b91_yandex2.ybl | Select-Object Name, Length

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sampleGW_b91-fw
          path: |
            sdk/tl_zigbee_sdk/cmake_build/sampleGW_b91.bin
            sdk/tl_zigbee_sdk/cmake_build/sampleGW_b91_yandex2.ybl
            sdk/tl_zigbee_sdk/cmake_build/sampleGW_b91.map
